[project]
name = "kudzu"
version = "0.1.0"
description = "Targeted wordlist generator for internal pentest password spraying."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ned0x1" }]
keywords = ["pentest", "wordlist", "password-spraying", "active-directory", "security"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
kudzu = "kudzu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kudzu"]
